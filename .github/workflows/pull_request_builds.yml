name: Build a version of TypeScript on request
on:
  repository_dispatch:

# This workflow is triggered from an API call where XXX is your token
# and YYY is the PR that it should look at.

# curl https://api.github.com/repos/microsoft/typescript-make-monaco-builds/dispatches \
#   -XPOST \
#   -H 'Content-Type: application/json' \
#   -H 'Accept: application/vnd.github.everest-preview+json' \
#   -H "Authorization: token XXX" \
#   --data-binary '{ "event_type": "YYY" }'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on:
      - "self-hosted"
      - "1ES.Pool=TypeScript-1ES-GitHub-Deploys"
      - "1ES.ImageOverride=azure-linux-3"
    environment:
      name: azure
      deployment: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # Lets us use one-liner JSON manipulations on package.jsons
      - run: "npm install -g json"

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Create GitHub App token
        id: app-token
        uses: microsoft/create-github-app-token-via-key-vault@5ba0d436e9c3cac52feff4d1f2f66f9698ce4a2d # v1
        with:
          client-id: ${{ vars.TYPESCRIPT_AUTOMATION_GITHUB_APP_CLIENT_ID }}
          key-id: ${{ vars.TYPESCRIPT_AUTOMATION_GITHUB_APP_KEY_ID }}
          owner: microsoft
          repositories: |
            TypeScript
            TypeScript-Make-Monaco-Builds
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Publish PR Build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

        run: |
          npm ci

          PULL_REQUEST_NUMBER=$(json -f $GITHUB_EVENT_PATH action)
          echo "Publishing Monaco based on $PULL_REQUEST_NUMBER"

          ZIP_FILE=$(node pulls/echo-typescript-url.ts $PULL_REQUEST_NUMBER)
          echo "Using zip file from:"
          echo $ZIP_FILE

          SEMVER_NUMBER=$(node pulls/echo-release-version.ts $PULL_REQUEST_NUMBER)

          echo "Re-publishing TypeScript tarball to npm"
          node ./pulls/republish-typescript-tarball.ts $ZIP_FILE $SEMVER_NUMBER

          echo "Building TS Monaco $SEMVER_NUMBER"

          echo "Building Monaco Editor with the new TS Monaco"
          node ./publish-monaco-editor.ts $SEMVER_NUMBER @typescript-deploys/pr-build

          echo ""
          echo ""
          echo ""
          echo "https://www.typescriptlang.org/play/?ts=$SEMVER_NUMBER"
          echo ""
          echo ""
          echo ""
          echo "Commenting back on the PR"
          node pulls/comment-on-release.ts $PULL_REQUEST_NUMBER $SEMVER_NUMBER

      - name: 'Az CLI login'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}


      - name: Upload to Azure
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: node ./upload-assets-to-blob-storage.ts
